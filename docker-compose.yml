# Run the whole thing with:  mkdir -p data && docker compose up -d
# Then open http://localhost:2455

services:
  kakeibo:
    build:
      context: .
      args:
        # The container runs as this uid so the bind-mounted ./data stays
        # writable. 1000 is the first Linux user and covers most machines; if
        # `id -u` says otherwise, drop UID=... and GID=... into a .env file
        # beside this one (bash will not let you export UID inline).
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: kakeibo:latest
    container_name: kakeibo
    ports:
      - "2455:2455"
    volumes:
      # Your ledger lives here, on the host. Bind mounts are never removed by
      # `docker compose down` (with or without -v), and rebuilding the image
      # does not touch them, so your entries survive every redeploy.
      # Swap for a named volume (kakeibo-data:/data) if you would rather Docker
      # kept it out of the way.
      - ./data:/data
    environment:
      KAKEIBO_CURRENCY: "₹"
      KAKEIBO_LOCALE: "en-IN"
      # Without this the container runs on UTC, and "today" would be yesterday
      # for the first 5.5 hours of every IST day — entries would land on the
      # wrong date. Set this to wherever you actually are.
      TZ: "${TZ:-Asia/Kolkata}"
    restart: unless-stopped
